global:
  scrape_interval: 30s
  scrape_timeout: 10s
  evaluation_interval: 30s

rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets:
          - 127.0.0.1:9090
        labels:
          environment: staging

  - job_name: node
    static_configs:
      - targets:
          - 172.30.40.9:9100
        labels:
          host: esmii-vps
          monitoring_environment: staging
    metric_relabel_configs:
      - source_labels: [__name__, environment]
        regex: "esmii_.*;production"
        action: drop
