name: Release

on:
  push:
    branches:
      - main

permissions: {}

concurrency:
  group: release-main
  cancel-in-progress: false

env:
  CI: "true"
  COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"

jobs:
  release:
    name: Version main before build and deployment
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      actions: write
      contents: write
      pull-requests: write
    steps:
      - name: Check out the triggering main revision
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24.20.0
          check-latest: false
      - name: Enable the pinned package manager
        run: corepack enable
      - name: Install from the frozen lockfile
        run: corepack pnpm install --frozen-lockfile
      - name: Enforce Conventional Commits before release preparation
        run: corepack pnpm commitlint
      - name: Configure the release bot identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Refuse a stale main trigger
        run: |
          git fetch origin main
          test "$(git rev-parse origin/main)" = "${GITHUB_SHA}"
      - name: Generate the release commit, changelog, and provisional tag
        id: prepare
        run: |
          corepack pnpm release:prepare
          release_version="$(node scripts/app-version.mjs)"
          release_branch="automation/release-${release_version}-${GITHUB_RUN_ID}"
          printf 'release_version=%s\n' "${release_version}" >> "${GITHUB_OUTPUT}"
          printf 'release_branch=%s\n' "${release_branch}" >> "${GITHUB_OUTPUT}"
          git tag --delete "${release_version}"
          git push origin "HEAD:refs/heads/${release_branch}"
      - name: Open the bot release pull request
        id: pull-request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_BRANCH: ${{ steps.prepare.outputs.release_branch }}
          RELEASE_VERSION: ${{ steps.prepare.outputs.release_version }}
        run: |
          pull_request_url="$(gh pr create \
            --base main \
            --head "${RELEASE_BRANCH}" \
            --title "chore(release): ${RELEASE_VERSION}" \
            --body "Automated pre-build release commit for ${RELEASE_VERSION}. The immutable tag is attached to the protected main commit after this pull request merges.")"
          printf 'url=%s\n' "${pull_request_url}" >> "${GITHUB_OUTPUT}"
      - name: Merge the generated release through protected main
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PULL_REQUEST_URL: ${{ steps.pull-request.outputs.url }}
        run: gh pr merge "${PULL_REQUEST_URL}" --rebase --delete-branch
      - name: Attach the immutable tag to the merged main commit
        id: merged
        env:
          RELEASE_VERSION: ${{ steps.prepare.outputs.release_version }}
        run: |
          git fetch origin main --tags
          released_sha="$(git rev-parse origin/main)"
          released_version="$(git show "${released_sha}:package.json" | node -e 'let data=""; process.stdin.on("data", (chunk) => data += chunk); process.stdin.on("end", () => process.stdout.write("v" + JSON.parse(data).version));')"
          test "${released_version}" = "${RELEASE_VERSION}"
          git tag --annotate "${RELEASE_VERSION}" "${released_sha}" --message "Release ${RELEASE_VERSION}"
          git push origin "refs/tags/${RELEASE_VERSION}"
          printf 'released_sha=%s\n' "${released_sha}" >> "${GITHUB_OUTPUT}"
      - name: Synchronize release metadata back to dev
        id: synchronize
        env:
          RELEASED_SHA: ${{ steps.merged.outputs.released_sha }}
          RELEASE_VERSION: ${{ steps.prepare.outputs.release_version }}
        run: |
          git fetch origin dev
          git switch --force-create release-sync origin/dev
          git checkout "${RELEASED_SHA}" -- package.json CHANGELOG.md
          if ! git diff --quiet -- package.json CHANGELOG.md; then
            git add package.json CHANGELOG.md
            git commit --message "chore(release): sync ${RELEASE_VERSION} to dev"
            git push origin HEAD:dev
          fi
          printf 'dev_sha=%s\n' "$(git rev-parse HEAD)" >> "${GITHUB_OUTPUT}"
      - name: Dispatch the released main build, then the synchronized dev build
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_VERSION: ${{ steps.prepare.outputs.release_version }}
        run: |
          gh workflow run ci.yaml --ref main \
            --field release_version="${RELEASE_VERSION}" \
            --field release_channel=production
          gh workflow run ci.yaml --ref dev \
            --field release_version="${RELEASE_VERSION}" \
            --field release_channel=staging
